<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
  <title>Mr. Click</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #1a1a2e;
      color: #ffffff;
      transition: background-color 0.4s ease, color 0.4s ease;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .content {
      text-align: center;
      pointer-events: none;
    }

    .content h1 {
      font-size: clamp(2rem, 6vw, 4.5rem);
      font-weight: 300;
      letter-spacing: 2px;
      margin-bottom: 16px;
      transition: transform 0.15s ease;
    }

    .content p {
      font-size: clamp(0.9rem, 2vw, 1.3rem);
      opacity: 0.6;
      letter-spacing: 1px;
    }

    .click-count {
      margin-top: 30px;
      font-size: clamp(0.8rem, 1.5vw, 1rem);
      opacity: 0.4;
      letter-spacing: 1px;
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: scale(0);
      animation: rippleAnim 0.6s ease-out forwards;
      pointer-events: none;
    }

    @keyframes rippleAnim {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }

    body.clicked .content h1 {
      transform: scale(0.95);
    }

    .color-preview {
      margin-top: 20px;
      font-family: 'Courier New', monospace;
      font-size: clamp(0.8rem, 1.8vw, 1.1rem);
      opacity: 0.5;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div class="content">
    <h1>Mr. Click</h1>
    <p>the entire page is a button</p>
    <div class="color-preview" id="colorCode">#1a1a2e</div>
    <div class="click-count" id="clickCount">0 clicks</div>
  </div>

  <script>
    let clicks = 0;
    let index = 0;

    const colors = [
      { bg: '#e63946', text: '#ffffff' },
      { bg: '#457b9d', text: '#ffffff' },
      { bg: '#2a9d8f', text: '#ffffff' },
      { bg: '#e9c46a', text: '#264653' },
      { bg: '#f4a261', text: '#264653' },
      { bg: '#264653', text: '#e9c46a' },
      { bg: '#6a0572', text: '#ffffff' },
      { bg: '#1b998b', text: '#ffffff' },
      { bg: '#ff6b6b', text: '#ffffff' },
      { bg: '#4ecdc4', text: '#2c3e50' },
      { bg: '#2c3e50', text: '#ecf0f1' },
      { bg: '#8338ec', text: '#ffffff' }
    ];

    const colorCode = document.getElementById('colorCode');
    const clickCount = document.getElementById('clickCount');

    function updateColors() {
      const next = colors[index];
      document.body.style.backgroundColor = next.bg;
      document.body.style.color = next.text;
      colorCode.textContent = next.bg.toUpperCase();
      index = (index + 1) % colors.length;
    }

    function showRipple(x, y) {
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      const size = Math.max(window.innerWidth, window.innerHeight);
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = x - size / 2 + 'px';
      ripple.style.top = y - size / 2 + 'px';
      document.body.appendChild(ripple);
      ripple.addEventListener('animationend', () => ripple.remove());
    }

    document.body.addEventListener('click', (e) => {
      clicks += 1;
      clickCount.textContent = clicks + (clicks === 1 ? ' click' : ' clicks');
      document.body.classList.add('clicked');
      updateColors();
      showRipple(e.clientX, e.clientY);
      setTimeout(() => document.body.classList.remove('clicked'), 150);
    });
  </script>
</body>
</html>
